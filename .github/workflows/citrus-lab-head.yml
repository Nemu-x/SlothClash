# The Citrus lab (tests/citrus-lab) against the current head of Citrus' dev
# branch instead of the pinned commit: an early warning when Citrus changes
# something the shipped core depends on. Weekly and on demand, never on PRs,
# so it gates nothing; a red run means: look at the logs, then bump the dev
# pin in tests/citrus-lab/citrus.json (or report the regression to Citrus).

name: Citrus lab (dev head)

on:
  schedule:
    - cron: '0 5 * * 2' # weekly, Tuesday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citrus-lab-head
  cancel-in-progress: true

jobs:
  citrus-lab-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The core's Go release is pinned in core/mihomo/.tool-versions (setup-go
      # v5 cannot read that file); the script also forces it via GOTOOLCHAIN.
      - name: Core Go version
        id: go
        run: echo "version=$(awk '$1 == "golang" { print $2 }' core/mihomo/.tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - name: Build the patched core (linux-amd64)
        run: node scripts/core-build.mjs dist linux-amd64 --skip-tests

      - name: Stock core of the same tag (comparison column)
        run: |
          TAG=$(node -p "require('./core/mihomo/manifest.json').tag")
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/$TAG/mihomo-linux-amd64-v2-$TAG.gz" | gunzip > stock-mihomo
          chmod +x stock-mihomo

      - name: Citrus lab against Citrus dev head
        working-directory: tests/citrus-lab
        env:
          CITRUS_LAB: '1'
          CITRUS_LAB_FLAVOR: head
          CITRUS_LAB_CACHE: ${{ runner.temp }}/citrus-lab-cache
          CITRUS_LAB_LOG_DIR: ${{ runner.temp }}/citrus-lab-logs
          SLOTH_MIHOMO_BIN: ${{ github.workspace }}/dist/mihomo-linux-amd64
          SLOTH_MIHOMO_STOCK_BIN: ${{ github.workspace }}/stock-mihomo
        run: go test -v -count=1 -parallel 12 -timeout 15m .

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: citrus-lab-head-logs
          path: ${{ runner.temp }}/citrus-lab-logs
          if-no-files-found: ignore
          retention-days: 14
