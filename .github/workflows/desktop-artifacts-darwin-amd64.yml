# macOS Intel (darwin/amd64) — separate workflow so tag releases are not blocked by macos-13 queue.
# Pushes the same tag: softprops/action-gh-release adds this zip to the existing Release.

name: Desktop artifacts (macOS Intel)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-amd64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (darwin/amd64)
        run: pnpm run desktop:build:darwin:amd64

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-darwin-amd64
          path: apps/sloth-clash-desktop/build/bin/

  release-intel:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - darwin-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sloth-clash-darwin-amd64
          path: artifacts/sloth-clash-darwin-amd64

      - name: Pack artifact for GitHub Release
        run: |
          mkdir -p dist
          d="artifacts/sloth-clash-darwin-amd64"
          (cd "$d" && zip -r "../../dist/sloth-clash-darwin-amd64-${GITHUB_REF_NAME}.zip" .)
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: false
          files: dist/*.zip
