# macOS Intel (darwin/amd64) is kept as manual-only fallback because macos-13 queues are unreliable.
# It does not run on tag push and does not block standard releases.

name: Desktop artifacts (macOS Intel)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-amd64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (darwin/amd64)
        run: pnpm run desktop:build:darwin:amd64

      - name: Package DMG (darwin/amd64)
        run: pnpm run desktop:package:dmg

      - name: Pack macOS Intel artifact
        run: |
          mkdir -p dist
          cp apps/sloth-clash-desktop/build/bin/*.dmg dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-amd64
          path: dist/*.dmg

  release-intel:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - darwin-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-darwin-amd64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          overwrite_files: true
          files: dist/**/*.dmg
