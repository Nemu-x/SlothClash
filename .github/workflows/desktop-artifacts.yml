# Builds Sloth Clash desktop for Windows, macOS Apple Silicon, and Linux.
# macOS Intel (darwin/amd64) is in desktop-artifacts-darwin-amd64.yml (slow GitHub queue).
# Service binaries: https://github.com/Nemu-x/sloth-clash-service-ipc/releases
# Run: workflow_dispatch or push tag v* — both workflows attach assets to the same Release.

name: Desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NSIS (Windows installer)
        run: choco install nsis -y

      - name: Desktop resources + icons + NSIS template
        run: pnpm run desktop:resources

      - name: Wails build (windows/amd64 + NSIS)
        run: pnpm run desktop:build:windows

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-windows-amd64
          path: apps/sloth-clash-desktop/build/bin/

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (darwin/arm64)
        run: pnpm run desktop:build:darwin:arm64

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-darwin-arm64
          path: apps/sloth-clash-desktop/build/bin/

  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Linux GUI deps (GTK + WebKit2GTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (linux/amd64)
        run: pnpm run desktop:build:linux:amd64

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-linux-amd64
          path: apps/sloth-clash-desktop/build/bin/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-amd64
      - darwin-arm64
      - linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack artifacts for GitHub Release
        run: |
          mkdir -p dist
          for d in artifacts/sloth-clash-*; do
            name=$(basename "$d")
            (cd "$d" && zip -r "../../dist/${name}-${GITHUB_REF_NAME}.zip" .)
          done
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          files: dist/*.zip
