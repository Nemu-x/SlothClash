# Builds Sloth Clash desktop (Wails + Go + React) for Windows / macOS / Linux.
# Service binaries for `pnpm run prebuild` / `prepare:wails` come from:
# https://github.com/Nemu-x/sloth-clash-service-ipc/releases (per-target tags, e.g. x86_64-pc-windows-msvc).
# Run manually (workflow_dispatch) or push a version tag (e.g. v0.1.0).

name: Desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NSIS (Windows installer)
        run: choco install nsis -y

      - name: Desktop resources + icons + NSIS template
        run: pnpm run desktop:resources

      - name: Wails build (windows/amd64 + NSIS)
        run: pnpm run desktop:build:windows

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-windows-amd64
          path: apps/sloth-clash-desktop/build/bin/

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (darwin/arm64)
        run: pnpm run desktop:build:darwin:arm64

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-darwin-arm64
          path: apps/sloth-clash-desktop/build/bin/

  darwin-amd64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (darwin/amd64)
        run: pnpm run desktop:build:darwin:amd64

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-darwin-amd64
          path: apps/sloth-clash-desktop/build/bin/

  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Linux GUI deps (GTK + WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (linux/amd64)
        run: pnpm run desktop:build:linux:amd64

      - uses: actions/upload-artifact@v4
        with:
          name: sloth-clash-linux-amd64
          path: apps/sloth-clash-desktop/build/bin/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-amd64
      - darwin-arm64
      - darwin-amd64
      - linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack artifacts for GitHub Release
        run: |
          mkdir -p dist
          for d in artifacts/sloth-clash-*; do
            name=$(basename "$d")
            (cd "$d" && zip -r "../../dist/${name}-${GITHUB_REF_NAME}.zip" .)
          done
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          files: dist/*.zip
