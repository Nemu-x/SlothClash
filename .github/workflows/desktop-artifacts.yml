# Builds Sloth Clash desktop for Windows, macOS Apple Silicon, and Linux.
# macOS Intel (darwin/amd64) is in desktop-artifacts-darwin-amd64.yml (slow GitHub queue).
# Service binaries: https://github.com/Nemu-x/sloth-clash-service-ipc/releases
# Run: workflow_dispatch or push tag v* — both workflows attach assets to the same Release.

name: Desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NSIS (Windows installer)
        run: choco install nsis -y

      - name: Desktop resources + icons + NSIS template
        run: pnpm run desktop:resources

      - name: Wails build (windows/amd64 + NSIS)
        run: pnpm run desktop:build:windows

      - name: Pack Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem "apps/sloth-clash-desktop/build/bin" -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer .exe not found in build/bin" }
          Compress-Archive -Path $installer.FullName -DestinationPath "dist/sloth-clash-windows-amd64-installer-${{ github.ref_name }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/sloth-clash-windows-amd64-installer-${{ github.ref_name }}.zip

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (darwin/arm64)
        run: pnpm run desktop:build:darwin:arm64

      - name: Pack macOS arm64 artifact (preserve executable bits)
        run: |
          mkdir -p dist
          tar -C apps/sloth-clash-desktop/build/bin -czf "dist/sloth-clash-darwin-arm64-${GITHUB_REF_NAME}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/sloth-clash-darwin-arm64-${{ github.ref_name }}.tar.gz

  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: apps/sloth-clash-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Linux GUI deps (GTK + WebKit2GTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop resources
        run: pnpm run desktop:resources

      - name: Wails build (linux/amd64)
        run: pnpm run desktop:build:linux:amd64

      - name: Pack Linux artifact (preserve executable bits)
        run: |
          mkdir -p dist
          tar -C apps/sloth-clash-desktop/build/bin -czf "dist/sloth-clash-linux-amd64-${GITHUB_REF_NAME}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/sloth-clash-linux-amd64-${{ github.ref_name }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-amd64
      - darwin-arm64
      - linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
