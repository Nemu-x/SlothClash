# Publishes the on-demand OpenConnect component bundle as a GitHub release asset
# (corp-vpn-coexistence, brick 2). The desktop downloads this at runtime ONLY
# when a user opts into the corporate-VPN feature — it never ships in the base
# installer, so regular users carry no cost.
#
# The asset lands under a stable, versioned tag so its download URL is
# predictable and can be pinned in openconnect_spec.go together with the
# SHA-256 the job prints (fail-closed verification — the app rejects any bundle
# whose hash does not match the pin).
#
# Relocatable: dylibbundler rewrites the binary + its dylibs to load via
# @executable_path/libs, so it runs on a machine without Homebrew. The canonical
# vpnc-script (captures pushed corp routes/DNS) is bundled alongside.
name: Publish — OpenConnect component

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the component under"
        required: true
        default: components-openconnect-9.21
  # Until this workflow lands on the default branch, workflow_dispatch is not
  # selectable, so a narrow push trigger (scoped to THIS file only) lets a push
  # to the feature branch kick off the one-shot build without re-firing on
  # unrelated commits.
  push:
    branches: [feat/openconnect-integration]
    paths:
      - .github/workflows/publish-openconnect-component.yml

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple silicon
            arch: arm64
          - runner: macos-13 # Intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    # inputs.tag only exists on workflow_dispatch; on the push trigger it is
    # empty, so fall back to the pinned default (GitHub expressions treat "" as
    # falsy, so `inputs.tag || default` picks the default on push).
    env:
      COMPONENT_TAG: ${{ inputs.tag || 'components-openconnect-9.21' }}
    steps:
      - name: Install openconnect + dylibbundler
        run: brew install openconnect dylibbundler

      - name: Record exact openconnect version
        run: openconnect --version | tee "openconnect-version-${{ matrix.arch }}.txt"

      - name: Assemble relocatable bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/libs
          if [ -x "$(brew --prefix openconnect)/sbin/openconnect" ]; then
            cp "$(brew --prefix openconnect)/sbin/openconnect" bundle/openconnect
          else
            cp "$(brew --prefix openconnect)/bin/openconnect" bundle/openconnect
          fi
          chmod +x bundle/openconnect
          # Canonical vpnc-script — captures pushed corp routes/DNS (CISCO_SPLIT_INC_* etc).
          curl -fsSL "https://gitlab.com/openconnect/vpnc-scripts/-/raw/master/vpnc-script" -o bundle/vpnc-script
          chmod +x bundle/vpnc-script
          dylibbundler -od -b -x ./bundle/openconnect -d ./bundle/libs -p @executable_path/libs

      - name: Verify relocatable (no Homebrew paths remain)
        run: |
          set -euo pipefail
          otool -L bundle/openconnect
          if otool -L bundle/openconnect | grep -q "/opt/homebrew\|/usr/local/Cellar\|/usr/local/opt"; then
            echo "FAIL: binary still references a Homebrew path — not relocatable"
            exit 1
          fi
          echo "OK: no Homebrew paths"

      - name: Package + hash
        id: pkg
        run: |
          set -euo pipefail
          asset="openconnect-macos-${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" -C bundle .
          sha=$(shasum -a 256 "$asset" | awk '{print $1}')
          echo "$sha  $asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### OpenConnect component — ${{ matrix.arch }}"
            echo ""
            echo "- asset: \`$asset\`"
            echo "- sha256: \`$sha\`"
            echo "- size: $(ls -lh "$asset" | awk '{print $5}')"
            echo ""
            echo "Pin in \`openconnect_spec.go\`:"
            echo '```go'
            echo "URL:    \"https://github.com/${{ github.repository }}/releases/download/${{ env.COMPONENT_TAG }}/$asset\","
            echo "SHA256: \"$sha\","
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$COMPONENT_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Components — OpenConnect ($tag)" \
              --notes "On-demand OpenConnect bundles for the corporate-VPN feature. Not an app release." \
              --prerelease
          fi
          gh release upload "$tag" \
            "${{ steps.pkg.outputs.asset }}" \
            "${{ steps.pkg.outputs.asset }}.sha256" \
            "openconnect-version-${{ matrix.arch }}.txt" --clobber
