dns:
  enable: true
  serve-expired: true
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 1800
  nameserver:
    - 223.5.5.5
proxies:
  - {name: node, type: ss, server: 192.0.2.1, port: 443, cipher: chacha20-ietf-poly1305, password: password}
proxy-groups:
  - {name: GLOBAL, type: select, proxies: [node]}
rules:
  - MATCH,GLOBAL
