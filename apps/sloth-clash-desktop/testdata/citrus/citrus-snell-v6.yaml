# Citrus compatibility fixture, see docs/core-patches.md (Citrus compatibility suite).
# Source: getmikan/Citrus@b0f91a16 docs/config.yaml lines 623-627 (the snell proxy) and 628, 631 (version 6 and its mode, commented out there)
# License: GPL-3.0 (Citrus, like ClashFest). Copied as test data.
# Changes from the source:
#   - the commented-out options uncommented with version 6 and wrapped into a minimal profile
#   - psk yourpsk replaced by a 15-byte placeholder: v6 needs 12 to 255 bytes, and Citrus and
#     mihomo v1.19.34 both refuse the 7-byte example

proxies:
  - name: "snell"
    type: snell
    server: server
    port: 44046
    psk: yourpsk-v6-0001
    version: 6
    mode: default
proxy-groups:
  - {name: GLOBAL, type: select, proxies: [snell]}
rules:
  - MATCH,GLOBAL
