proxies:
  - name: node
    type: socks5
    server: 192.0.2.1
    port: 443
    tls: true
    fingerprint: abababababababababababababababababababababababababababababababab,cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
