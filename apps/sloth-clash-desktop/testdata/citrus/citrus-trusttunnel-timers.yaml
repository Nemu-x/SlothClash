proxies:
  - name: node
    type: trusttunnel
    server: 1.2.3.4
    port: 443
    username: username
    password: password
    udp: true
    ping-interval: 15
    ping-timeout: 15
    handshake-timeout: 10
proxy-groups:
  - {name: GLOBAL, type: select, proxies: [node]}
rules:
  - MATCH,GLOBAL
