proxies:
  - name: node
    type: vless
    server: server
    port: 443
    uuid: 27848739-7e62-4138-9fd3-098a63964b6b
    udp: true
    tls: true
    network: xhttp
    alpn: [h2]
    xhttp-opts:
      path: /xh
      mode: packet-up
      uplink-http-method: GET
      uplink-data-placement: header
proxy-groups:
  - {name: GLOBAL, type: select, proxies: [node]}
rules:
  - MATCH,GLOBAL
