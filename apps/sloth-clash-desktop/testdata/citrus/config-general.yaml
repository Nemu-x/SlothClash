# Source: getmikan/Citrus@ecaa9466 docs/config.yaml (mixed-port 3-3, find-process-mode 37-37, mode 39-39, geox-url 42-45, geo-auto-update 47-47, geo-update-interval 48-48, log-level 55-55, ipv6 62-62, experimental 204-211, hosts 214-214, profile 222-226)
