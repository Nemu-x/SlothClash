    type: socks5
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true
    # fingerprint: xxxx # 配置指纹将实现 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 获取，可用逗号分隔多个 (任一匹配即可)
    # 下面两项如果填写则开启 mTLS（需要同时填写）
