    # private-key: ./client.key # 证书对应的私钥 PEM 格式，或者私钥路径
    # fingerprint: xxxx # 配置指纹将实现 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 获取
    # skip-cert-verify: true
    # name-cert-verify: example.com # 仅修改证书 DNSName 校验目标，不修改 SNI

  - name: "vless-encryption"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    # -------------------------
    # vless encryption客户端配置：
    # （native/xorpub 的 XTLS Vision 可以 Splice。只使用 1-RTT 模式 / 若服务端发的 ticket 中秒数不为零则 0-RTT 复用）
    # / 是只能选一个，后面 base64 至少一个，无限串联，使用  citrus generate vless-x25519 和 citrus generate vless-mlkem768 生成，替换值时需去掉括号
    #
    # Padding 是可选的参数，仅作用于 1-RTT 以消除握手的长度特征，双端默认值均为 "100-111-1111.75-0-111.50-0-3333"：
    # 在 1-RTT client/server hello 后以 100% 的概率粘上随机 111 到 1111 字节的 padding
    # 以 75% 的概率等待随机 0 到 111 毫秒（"probability-from-to"）
    # 再次以 50% 的概率发送随机 0 到 3333 字节的 padding（若为 0 则不 Write()）
    # 服务端、客户端可以设置不同的 padding 参数，按 len、gap 的顺序无限串联，第一个 padding 需概率 100%、至少 35 字节
    # -------------------------
    encryption: "mlkem768x25519plus.native.0rtt.XKbaq1BuzJKKKPxZbwgRpn-gYQbnhrYketgezASCL1I"
    tls: false #可以不开启tls
    udp: true

  - name: "vless-reality-vision"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com # REALITY servername
    reality-opts:
      public-key: CrrQSjAG_YkHLwvM2M-7XkKJilgL5upBKCp0od0tLhE
      short-id: 10f897e26c4b9478 # optional
      # support-x25519mlkem768: true # 默认开启 (Xray v26.9.8+ 服务端要求), 仅旧版服务端需设为 false; 无 X25519MLKEM768 的 client-fingerprint 会自动注入
      # client-version: 26.10.10 # optional, 上报给服务端的 Xray 版本 (minClientVer/maxClientVer), 默认 26.10.10
      # mldsa65-verify: xxx # optional, Xray 的 mldsa65Verify (分享链接 pqv), base64url 编码的 ML-DSA-65 公钥
    client-fingerprint: chrome # cannot be empty

