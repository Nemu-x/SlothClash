proxies:
  - { name: entry, type: vless, server: entry.example.com, port: 443, uuid: 27848739-7e62-4138-9fd3-098a63964b6b }
  - { name: exit-de, type: vless, server: de.example.com, port: 443, uuid: 27848739-7e62-4138-9fd3-098a63964b6b }
  - { name: exit-nl, type: vless, server: nl.example.com, port: 443, uuid: 27848739-7e62-4138-9fd3-098a63964b6b }

proxy-groups:
  - name: exits
    type: url-test
    proxies: [exit-de, exit-nl]
    url: https://cp.cloudflare.com/generate_204

  - name: cascade
    type: chain
    proxies: [entry, exits] # in order: the first hop, ..., the exit
    url: https://cp.cloudflare.com/generate_204
    interval: 300

rules:
  - MATCH,cascade
