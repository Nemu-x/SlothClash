mixed-port: 7890
socks-port: 0
port: 0
ipv6: true
allow-lan: false
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: true
    store-selected: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: true
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: true
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    proxy-server-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
proxies:
    - ech-opts:
        config: |
            -----BEGIN ECH CONFIGS-----
            AF7+DQBaAAAgACD+nQ9dVWNPHBFh+pMttOfQBrh3uqbkBbNHC4wqbElpEgAkAAEA
            AQABAAIAAQADAAIAAQACAAIAAgADAAMAAQADAAIAAwADAAtleGFtcGxlLmNvbQAA
            -----END ECH CONFIGS-----
        enable: true
      name: ech-config-pem
      network: tcp
      port: 443
      server: 192.0.2.1
      servername: www.example.com
      tls: true
      type: vless
      uuid: 27848739-7e62-4138-9fd3-098a63964b6b
    - ech-opts:
        enable: true
        query-server: https://1.1.1.1/dns-query
        query-server-name: example.com
      name: ech-query-server
      network: tcp
      port: 443
      server: 192.0.2.1
      servername: www.example.com
      tls: true
      type: vless
      uuid: 27848739-7e62-4138-9fd3-098a63964b6b
rules:
    - MATCH,DIRECT
