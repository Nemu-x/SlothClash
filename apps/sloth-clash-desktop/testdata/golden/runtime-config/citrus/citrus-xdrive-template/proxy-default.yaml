mixed-port: 7890
socks-port: 0
port: 0
ipv6: true
allow-lan: false
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: false
    store-selected: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: false
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: true
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
proxies:
    - client-fingerprint: chrome
      encryption: mlkem768x25519plus.native.0rtt.XKbaq1BuzJKKKPxZbwgRpn-gYQbnhrYketgezASCL1I
      name: vless-xdrive
      network: xdrive
      port: 443
      server: storage-node
      type: vless
      udp: true
      uuid: 27848739-7e62-4138-9fd3-098a63964b6b
      xdrive-opts:
        remote-folder: folder
        secrets:
            - user
            - password
        service: template
        template:
            auth:
                password: '{secret1}'
                type: basic
                username: '{secret0}'
            delete:
                method: DELETE
                url: https://storage.example/{folder}/{name}
            flatten: true
            get:
                method: GET
                url: https://storage.example/{folder}/{name}
            list:
                method: PROPFIND
                namesRegex: <d:href>/folder/([^<]+)</d:href>
                url: https://storage.example/{folder}/
            put:
                method: PUT
                url: https://storage.example/{folder}/{name}
            retry:
                status:
                    - 429
                    - 500
                    - 502
                    - 503
                    - 504
proxy-groups:
    - name: GLOBAL
      proxies:
        - vless-xdrive
      type: select
rules:
    - MATCH,GLOBAL
