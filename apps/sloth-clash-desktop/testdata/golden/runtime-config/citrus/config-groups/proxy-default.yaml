mixed-port: 7890
socks-port: 0
port: 0
ipv6: true
allow-lan: false
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: false
    store-selected: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: false
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: true
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
proxy-providers:
    provider1:
        header:
            User-Agent:
                - Clash/v1.18.0
                - citrus/1.18.3
        health-check:
            enable: true
            interval: 600
            url: https://cp.cloudflare.com/generate_204
        interval: 3600
        override:
            name-cert-verify: example.com
            skip-cert-verify: true
            udp: true
        path: ./provider1.yaml
        proxy: DIRECT
        type: http
        url: url
proxies:
    - cipher: chacha20-ietf-poly1305
      name: ss1
      password: password
      port: 443
      server: 192.0.2.1
      type: ss
    - cipher: chacha20-ietf-poly1305
      name: ss2
      password: password
      port: 443
      server: 192.0.2.2
      type: ss
    - name: vless1
      port: 443
      server: 192.0.2.3
      type: vless
      uuid: 27848739-7e62-4138-9fd3-098a63964b6b
proxy-groups:
    - interval: 300
      name: auto
      proxies:
        - ss1
        - ss2
        - vless1
      type: url-test
      url: https://cp.cloudflare.com/generate_204
    - interval: 300
      name: fallback-auto
      proxies:
        - ss1
        - ss2
        - vless1
      type: fallback
      url: https://cp.cloudflare.com/generate_204
    - interval: 300
      name: load-balance
      proxies:
        - ss1
        - ss2
        - vless1
      type: load-balance
      url: https://cp.cloudflare.com/generate_204
    - name: Proxy
      proxies:
        - ss1
        - ss2
        - vless1
        - auto
      type: select
    - filter: HK|TW
      name: UseProvider
      proxies:
        - Proxy
        - DIRECT
      type: select
      use:
        - provider1
