mixed-port: 7890
socks-port: 0
port: 0
ipv6: true
allow-lan: false
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: false
    store-selected: true
tun:
    auto-detect-interface: true
    auto-redirect: false
    auto-route: true
    dns-hijack:
        - any:53
    enable: false
    route-address:
        - 0.0.0.0/1
        - 128.0.0.0/1
        - ::/1
        - 8000::/1
    route-address-set:
        - ruleset-1
        - ruleset-2
    route-exclude-address-set:
        - ruleset-3
        - ruleset-4
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: true
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
