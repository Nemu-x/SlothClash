mixed-port: 7890
socks-port: 0
port: 0
ipv6: false
allow-lan: true
bind-address: '*'
mode: rule
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: false
    store-selected: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: false
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: false
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
proxy-providers:
    p1:
        interval: 3600
        path: ./providers/p1.yaml
        type: http
        url: https://example.com/sub1.yaml
    p2:
        interval: 3600
        path: ./providers/p2.yaml
        type: http
        url: https://example.com/sub2.yaml
proxy-groups:
    - interval: 300
      name: MainGroup
      type: url-test
      url: http://www.gstatic.com/generate_204
      use:
        - p1
        - p2
    - interval: 300
      name: FallbackGroup
      type: fallback
      url: http://www.gstatic.com/generate_204
      use:
        - p1
        - p2
    - name: Final
      proxies:
        - MainGroup
        - FallbackGroup
        - DIRECT
      type: select
rule-providers:
    private:
        behavior: classical
        interval: 3600
        path: ./ruleset/private.yaml
        type: http
        url: https://example.com/private.yaml
rules:
    - RULE-SET,private,DIRECT
    - MATCH,Final
