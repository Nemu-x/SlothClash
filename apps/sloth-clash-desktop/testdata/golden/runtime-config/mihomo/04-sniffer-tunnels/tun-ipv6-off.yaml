mixed-port: 7890
socks-port: 0
port: 0
ipv6: false
allow-lan: false
mode: rule
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: true
    store-selected: true
sniffer:
    enable: true
    parse-pure-ip: true
    sniff:
        HTTP:
            override-destination: true
            ports:
                - "80"
                - 8080-8880
        QUIC:
            ports:
                - "443"
                - "8443"
        TLS:
            ports:
                - "443"
                - "8443"
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: true
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: false
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    proxy-server-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
tunnels:
    - address: 127.0.0.1:7001
      network: tcp
      proxy: DIRECT
      target: 10.0.0.2:22
proxy-groups:
    - name: Main
      proxies:
        - DIRECT
        - REJECT
      type: select
rules:
    - PROCESS-NAME,ssh.exe,DIRECT
    - MATCH,Main
