mixed-port: 7890
socks-port: 0
port: 0
ipv6: false
allow-lan: true
bind-address: '*'
mode: rule
log-level: debug
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: false
    store-selected: true
sniffer:
    enable: true
    force-dns-mapping: true
    override-destination: true
    parse-pure-ip: true
    sniff:
        HTTP:
            ports:
                - 80
                - 8080-8880
        QUIC:
            ports:
                - 443
                - 8443
        TLS:
            ports:
                - 443
                - 8443
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: false
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - 223.5.5.5
        - 1.1.1.1
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    fallback:
        - https://9.9.9.9/dns-query
    fallback-filter:
        geoip: true
        geoip-code: AE
    ipv6: false
    listen: 0.0.0.0:1053
    nameserver:
        - https://1.1.1.1/dns-query
        - https://dns.google/dns-query
        - tls://8.8.8.8:853
    proxy-server-nameserver:
        - https://1.1.1.1/dns-query
    respect-rules: true
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
proxies:
    - alterId: 0
      cipher: auto
      name: vmess-ws
      network: ws
      port: 443
      server: vmess-ws.example.test
      servername: ws.example.test
      tls: true
      type: vmess
      uuid: 11111111-1111-1111-1111-111111111111
      ws-opts:
        headers:
            Host: ws.example.test
        path: /vmess-ws
    - flow: xtls-rprx-vision
      name: vless-vision-reality
      network: tcp
      port: 443
      reality-opts:
        public-key: reality-public-key
        short-id: 0123456789abcdef
      server: vision.example.test
      servername: cdn.example.test
      tls: true
      type: vless
      uuid: 22222222-2222-2222-2222-222222222222
    - grpc-opts:
        grpc-service-name: VLessService
      name: vless-grpc
      network: grpc
      port: 443
      server: vless-grpc.example.test
      servername: vgrpc.example.test
      tls: true
      type: vless
      uuid: 33333333-3333-3333-3333-333333333333
    - name: vless-xhttp
      network: xhttp
      port: 443
      server: xhttp.example.test
      servername: xhttp.example.test
      tls: true
      type: vless
      uuid: 44444444-4444-4444-4444-444444444444
      xhttp-opts:
        host: xhttp.example.test
        mode: stream-up
        path: /
    - name: trojan-tcp
      network: tcp
      password: yourpsk
      port: 443
      server: trojan.example.test
      sni: trojan.example.test
      type: trojan
    - name: mieru-tcp
      password: password
      port: 2999
      server: mieru.example.test
      transport: TCP
      type: mieru
      username: user
    - name: hysteria2-main
      password: yourpassword
      port: 443
      server: hy2.example.test
      sni: hy2.example.test
      type: hysteria2
    - alpn:
        - h3
      name: tuic-v5-main
      password: PASSWORD_1
      port: 10443
      server: tuic.example.test
      type: tuic
      uuid: 55555555-5555-5555-5555-555555555555
    - name: anytls-main
      password: <password>
      port: 443
      server: 1.2.3.4
      sni: example.com
      type: anytls
proxy-groups:
    - name: parser-test
      proxies:
        - auto-test
        - failover
        - balance
        - vmess-ws
        - vless-vision-reality
        - vless-grpc
        - vless-xhttp
        - trojan-tcp
        - mieru-tcp
        - hysteria2-main
        - tuic-v5-main
        - anytls-main
        - DIRECT
      type: select
    - interval: 300
      name: auto-test
      proxies:
        - vmess-ws
        - vless-vision-reality
        - vless-grpc
        - vless-xhttp
        - trojan-tcp
        - hysteria2-main
        - tuic-v5-main
      type: url-test
      url: http://www.gstatic.com/generate_204
    - interval: 300
      name: failover
      proxies:
        - vmess-ws
        - vless-grpc
        - anytls-main
      type: fallback
      url: http://www.gstatic.com/generate_204
    - interval: 300
      name: balance
      proxies:
        - vless-xhttp
        - trojan-tcp
        - mieru-tcp
      strategy: consistent-hashing
      type: load-balance
      url: http://www.gstatic.com/generate_204
rules:
    - DOMAIN-SUFFIX,example.com,parser-test
    - DOMAIN-SUFFIX,example.org,auto-test
    - DOMAIN-KEYWORD,github,failover
    - DOMAIN-KEYWORD,google,balance
    - GEOIP,private,DIRECT,no-resolve
    - MATCH,parser-test
