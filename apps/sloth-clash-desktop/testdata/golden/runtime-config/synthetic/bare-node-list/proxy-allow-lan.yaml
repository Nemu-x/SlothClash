mixed-port: 7890
socks-port: 0
port: 0
ipv6: true
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: golden-secret
profile:
    store-fake-ip: false
    store-selected: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: false
    stack: gvisor
    strict-route: false
dns:
    default-nameserver:
        - system
        - 1.1.1.1
        - 8.8.8.8
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    fake-ip-filter-mode: blacklist
    fake-ip-range: 198.18.0.1/16
    fake-ip-range6: fdfe:dcba:9876::1/64
    ipv6: true
    listen: :1053
    nameserver:
        - 8.8.8.8
        - 1.1.1.1
        - https://1.1.1.1/dns-query
    respect-rules: false
    use-hosts: true
geodata-mode: true
geo-auto-update: false
reality-mlkem: auto
proxy-providers:
    sub1:
        health-check:
            enable: true
            interval: 600
            url: http://cp.cloudflare.com/generate_204
        interval: 3600
        path: ./providers/sub1.yaml
        type: http
        url: {{SUB_URL}}/sub
proxy-groups:
    - interval: 300
      name: Auto
      tolerance: 50
      type: url-test
      url: http://cp.cloudflare.com/generate_204
      use:
        - sub1
    - name: Manual
      proxies:
        - Auto
      type: select
      use:
        - sub1
rules:
    - MATCH,Manual
